<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | MovieMind</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div style="position: absolute; width: 100%; text-align: center; top: 20px; z-index: 1000;">
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}" style="color: #ff7675; margin-bottom: 10px; font-weight: bold; background: rgba(0,0,0,0.3); display: inline-block; padding: 10px 20px; border-radius: 10px; backdrop-filter: blur(5px);">
              {{ message }}
            </div>
          {% endfor %} 
        </div>
      {% endif %}
    {% endwith %}

    <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
        <div class="glass" style="padding: 40px; width: 350px; text-align: center;">
            <h2 style="margin-bottom: 20px;">Welcome Back</h2>
            
            <form action="/login" method="POST">
                <div style="margin-bottom: 15px;">
                    <input type="text" name="username" placeholder="Username" required 
                           style="width: 100%; padding: 12px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
                </div>

                <div style="margin-bottom: 20px;">
                    <input type="password" name="password" placeholder="Password" required 
                           style="width: 100%; padding: 12px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; border-radius: 25px; cursor: pointer;">
                    Login
                </button>
            </form>

            <p style="margin-top: 20px; font-size: 0.8rem;">
                <a href="/forget_password" style="color: #a29bfe; text-decoration: none;">Forgot Password?</a><br><br>
                Don't have an account? <a href="/signup" style="color: #a29bfe; text-decoration: none;">Sign Up</a>
            </p>
        </div>
    </div>
</body>
</html>
